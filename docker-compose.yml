version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: lms-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: lms_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./lms_db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - lms-network

  flask-ai:
    build:
      context: ./flask_service
      dockerfile: Dockerfile
    container_name: lms-flask-ai
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
    networks:
      - lms-network

volumes:
  mysql_data:

networks:
  lms-network:
    driver: bridge
